spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:techshop-test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
    username: ${TEST_DB_USERNAME:sa}
    password: ${TEST_DB_PASSWORD:}
  flyway:
    locations: ${TEST_MIGRATIONS:classpath:db/demo}
app:
  demo: false
  upload:
    dir: ./target/test-uploads

app.payment.mock.enabled: true

# AI jobs are driven explicitly by integration tests, not by context background threads.
app.ai.worker-enabled: false
