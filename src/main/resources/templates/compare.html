<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('So sánh sản phẩm')}"></head><body><header th:replace="~{fragments :: header}"></header><main><h1>So sánh sản phẩm</h1><form method="get" class="panel"><label>Mã 2–3 sản phẩm, cách nhau bằng dấu phẩy<input name="ids" placeholder="7,8" required pattern="[0-9]+,[0-9]+(,[0-9]+)?"></label><button>So sánh</button></form><div class="table-wrap panel" th:if="${comparison!=null}"><table><thead><tr><th>Thông số</th><th th:each="p:${comparison.products()}"><a th:href="@{/products/{id}(id=${p.id()})}" th:text="${p.name()}"></a></th></tr></thead><tbody><tr><th>Giá tham khảo</th><td th:each="p:${comparison.products()}" th:text="${#numbers.formatInteger(p.price(),1,'POINT')}+' ₫'"></td></tr><tr th:each="r:${comparison.specifications()}"><th th:text="${r.group()}+' · '+${r.name()}"></th><td th:each="v:${r.values()}" th:text="${v}"></td></tr></tbody></table></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
