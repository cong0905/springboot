<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Voucher cá nhân')}"></head><body><header th:replace="~{fragments :: header}"></header><main><h1>Voucher cá nhân</h1><p>Mã dành riêng cho tài khoản của bạn. Nhập mã ở bước thanh toán để kiểm tra điều kiện trên giỏ hàng hiện tại.</p><p th:if="${vouchers.isEmpty()}">Chưa có voucher được cấp.</p><div class="commerce-grid"><article class="panel" th:each="v:${vouchers}"><h2 th:text="${v.code()}"></h2><p th:text="${v.description()}"></p><p th:text="${v.discountType()=='PERCENT'?'Giảm '+v.discountValue()+'%':'Giảm '+v.discountValue()+' ₫'}"></p><p th:text="'Đơn tối thiểu: '+${#numbers.formatInteger(v.minOrderAmount(),1,'POINT')}+' ₫'"></p><p th:if="${v.expiresAt()!=null}" th:text="'Hết hạn (UTC): '+${v.expiresAt()}"></p><p th:text="${v.usable()?'Còn hiệu lực':'Đã dùng hết / hết hạn / tạm khóa'}"></p><a href="/cart">Tới giỏ hàng</a></article></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
