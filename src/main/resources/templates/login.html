<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đăng nhập')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="auth-wrap"><section class="panel auth-panel"><span class="eyebrow">CHÀO MỪNG TRỞ LẠI</span><h1>Đăng nhập</h1><p class="muted">Tiếp tục chọn những món đồ bạn yêu thích.</p><p class="alert" th:if="${param.error}">Email hoặc mật khẩu không chính xác.</p><p class="success" th:if="${param.registered}">Đăng ký thành công. Bạn có thể đăng nhập.</p><p class="success" th:if="${param.logout}">Bạn đã đăng xuất.</p><form th:action="@{/login}" method="post"><label>Email<input type="email" name="username" autocomplete="username" required maxlength="254"></label><label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required></label><button class="full">Đăng nhập</button></form><p>Chưa có tài khoản? <a href="/register">Đăng ký</a></p></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
