<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Hồ sơ cá nhân')}"></head><body><header th:replace="~{fragments :: header}"></header><main>
<nav class="filters"><a href="/profile">Hồ sơ</a><a href="/member">Hội viên</a><a href="/orders">Đơn hàng</a></nav>
<h1>Hồ sơ cá nhân</h1><section class="panel"><img th:if="${profile.avatarPath()!=null}" th:src="${profile.avatarPath()}" alt="Ảnh đại diện" width="96" height="96"><form data-avatar-upload><input type="hidden" name="expectedVersion" th:value="${profile.version()}"><label>Ảnh đại diện (PNG/JPG/WebP, tối đa 5MB)<input type="file" name="file" accept="image/png,image/jpeg,image/webp" required></label><div class="form-message" role="alert"></div><button>Tải ảnh</button></form></section><div class="two-column"><section class="panel">
<form data-api="/api/v1/me/profile" data-method="PATCH" data-success="reload">
<input type="hidden" name="expectedVersion" data-number th:value="${profile.version()}">
<label>Họ tên<input name="fullName" th:value="${profile.fullName()}" minlength="2" maxlength="100" autocomplete="name" required></label>
<label>Email<input type="email" th:value="${profile.email()}" readonly></label>
<label>Số điện thoại<input type="tel" name="phone" th:value="${profile.phone()}" pattern="0[0-9]{9}" maxlength="10" autocomplete="tel"></label>
<label>Ngày sinh<input type="date" name="birthDate" data-null-empty th:value="${profile.birthDate()}"></label>
<label>Giới tính<select name="gender"><option value="UNSPECIFIED" th:selected="${profile.gender()=='UNSPECIFIED'}">Không cung cấp</option><option value="MALE" th:selected="${profile.gender()=='MALE'}">Nam</option><option value="FEMALE" th:selected="${profile.gender()=='FEMALE'}">Nữ</option><option value="OTHER" th:selected="${profile.gender()=='OTHER'}">Khác</option></select></label>
<div class="form-message" role="alert"></div><button>Lưu hồ sơ</button></form></section>
<section class="panel"><h2>Đổi mật khẩu</h2><p>Đổi thành công sẽ đăng xuất các phiên hiện tại. Hãy đăng nhập lại bằng mật khẩu mới.</p>
<form data-api="/api/v1/me/password" data-success="/login?passwordChanged"><label>Mật khẩu hiện tại<input type="password" name="currentPassword" autocomplete="current-password" required maxlength="128"></label><label>Mật khẩu mới<input type="password" name="newPassword" autocomplete="new-password" minlength="10" maxlength="64" required></label><div class="form-message" role="alert"></div><button>Đổi mật khẩu</button></form></section></div><section class="panel" th:if="${googleEnabled}"><h2>Liên kết Google</h2><p>Dùng tài khoản Google có cùng email với hồ sơ hiện tại.</p><form data-api="/api/v1/me/google-link" data-success="/oauth2/authorization/google"><label>Mật khẩu hiện tại<input type="password" name="currentPassword" autocomplete="current-password" required></label><div class="form-message" role="alert"></div><button>Xác nhận và liên kết</button></form></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
