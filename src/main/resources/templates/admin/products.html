<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Sản phẩm & kho')}"></head><body><header th:replace="~{fragments :: header}"></header><main><nav th:replace="~{fragments :: adminNav}"></nav><div class="section-heading"><h1>Sản phẩm & tồn kho</h1><a href="/admin/products/new" class="button">+ Thêm sản phẩm</a></div><form method="get" class="filters"><label>Tìm theo tên<input name="keyword" th:value="${keyword}" maxlength="100"></label><button>Tìm kiếm</button></form><div class="panel table-wrap"><table><thead><tr><th>SKU</th><th>Sản phẩm</th><th>Giá</th><th>Tồn</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="p : ${catalog.content()}"><td th:text="${p.sku()}"></td><td th:text="${p.name()}"></td><td th:text="${#numbers.formatInteger(p.price(),1,'POINT')} + ' ₫'"></td><td th:text="${p.stockQuantity()}"></td><td th:text="${p.status()}"></td><td><a th:href="@{/admin/products/{id}/edit(id=${p.id()})}">Chỉnh sửa / kho →</a></td></tr><tr th:if="${catalog.content().isEmpty()}"><td colspan="6">Chưa có sản phẩm.</td></tr></tbody></table></div><div class="pagination"><a th:if="${catalog.page() > 0}" th:href="@{/admin/products(page=${catalog.page()-1},keyword=${keyword})}">← Trước</a><span th:text="'Trang ' + ${catalog.page()+1}"></span><a th:if="${catalog.page()+1 < catalog.totalPages()}" th:href="@{/admin/products(page=${catalog.page()+1},keyword=${keyword})}">Sau →</a></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
