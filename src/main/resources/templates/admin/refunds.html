<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Hoàn tiền và đối soát')}"></head><body><header th:replace="~{fragments :: header}"></header><main><nav th:replace="~{fragments :: adminNav}"></nav><h1>Hoàn tiền và đối soát</h1><p>Chỉ xác nhận hoàn tất sau khi đã thực chuyển tiền và có mã đối soát. Màn hình ghi sổ xử lý thủ công; không thực hiện chuyển tiền qua ngân hàng.</p>
<form class="filters" method="get"><label>Trạng thái<select name="status"><option value="">Tất cả</option><option th:each="s:${ {'REQUESTED','PROCESSING','SUCCEEDED','FAILED'} }" th:value="${s}" th:text="${s}" th:selected="${status==s}"></option></select></label><label>Mã đơn<input name="orderId" type="number" min="1" th:value="${orderId}"></label><button>Lọc</button><a href="/admin/refunds">Xóa lọc</a></form>
<section class="panel"><h2>Tạo yêu cầu</h2><form data-api="/api/v1/admin/orders/{orderId}/refund" data-success="reload"><label>Mã đơn<input type="number" name="orderId" data-number min="1" required></label><label>Số tiền (₫)<input name="amount" type="number" data-number min="1" step="1" required></label><label>Lý do<textarea name="reason" minlength="5" maxlength="500" required></textarea></label><label>Loại<select name="refundType"><option value="ORDER_CANCELLATION">Hủy đơn chưa giao</option><option value="RETURN_GOODS">Trả hàng</option><option value="PRICE_ADJUSTMENT">Điều chỉnh giá</option></select></label><label><input name="restockItems" type="checkbox">Đã thực nhận lại toàn bộ hàng (đơn đang giao hoặc đã giao, hoàn đủ)</label><div class="form-message" role="alert"></div><button>Tạo yêu cầu</button></form></section>
<p th:if="${refunds.isEmpty()}">Chưa có yêu cầu phù hợp.</p><article class="panel" th:each="r:${refunds}"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;"><h2 style="margin:0;" th:text="${r.refundCode()}"></h2><span class="badge" th:style="${r.status()=='SUCCEEDED'?'background:#dcfce7;color:#166534;font-weight:600;':(r.status()=='PROCESSING'?'background:#dbeafe;color:#1e40af;font-weight:600;':(r.status()=='REQUESTED'?'background:#fef3c7;color:#92400e;font-weight:600;':'background:#fee2e2;color:#991b1b;font-weight:600;'))}" th:text="${r.status()=='SUCCEEDED'?'Hoàn tất':(r.status()=='PROCESSING'?'Đang xử lý':(r.status()=='REQUESTED'?'Yêu cầu mới':'Từ chối'))}"></span></div><div style="margin:8px 0;"><a th:href="@{/admin/orders/{id}(id=${r.orderId()})}" style="font-weight:600;" th:text="'Đơn hàng #' + ${r.orderId()}"></a> · <strong style="color:var(--primary);" th:text="${#numbers.formatInteger(r.amount(),1,'POINT')} + ' ₫'"></strong> · <span th:text="${r.refundType()=='ORDER_CANCELLATION'?'Hủy đơn chưa giao':(r.refundType()=='RETURN_GOODS'?'Trả hàng':'Điều chỉnh giá')}"></span></div><p th:text="'Lý do: ' + ${r.reason()}"></p><p class="muted" style="font-size:0.85rem;" th:text="'Người yêu cầu: #' + ${r.actorId()} + ' · Người xử lý: ' + (${r.processedBy() != null ? '#' + r.processedBy() : 'Chưa xử lý'}) + ' · Tham chiếu đối soát: ' + (${r.referenceCode() != null ? r.referenceCode() : 'Chưa có'})"></p><p th:if="${r.notes() != null}" class="muted" style="font-size:0.85rem;" th:text="'Ghi chú: ' + ${r.notes()}"></p>
<form th:if="${r.status()=='REQUESTED'||r.status()=='PROCESSING'}" th:attr="data-api='/api/v1/admin/refunds/'+${r.id()}+'/process'" data-success="reload" style="background:#f8fafc;padding:12px;border-radius:8px;border:1px solid var(--border);margin-top:12px;"><label>Mã ngân hàng / Mã đối soát giao dịch<input name="referenceCode" minlength="3" maxlength="100" placeholder="VD: VNPAY-REF-123456" required></label><label th:if="${!r.restockItems()}" class="check" style="margin-top:6px;"><input name="restockItems" type="checkbox"> Xác nhận đã thu hồi hàng về kho</label><label style="margin-top:6px;">Ghi chú xử lý<textarea name="notes" maxlength="1000" placeholder="Ghi chú nội bộ..."></textarea></label><input type="hidden" name="action" value="COMPLETE"><div class="form-message" role="alert"></div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;"><button type="submit" class="button">Hoàn tất hoàn tiền</button></div></form></article></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
