<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Danh mục')}"></head><body><header th:replace="~{fragments :: header}"></header><main><nav th:replace="~{fragments :: adminNav}"></nav><h1>Danh mục sản phẩm</h1><div class="two-column"><section><article class="panel" th:each="c : ${categories}"><form th:attr="data-api=${'/api/v1/admin/categories/' + c.id()}" data-method="PATCH" data-success="reload"><strong th:text="${c.code()}"></strong><input type="hidden" name="expectedVersion" data-number th:value="${c.version()}"><label>Tên danh mục<input name="name" th:value="${c.name()}" minlength="2" maxlength="100" required></label><label>Trạng thái<select name="status"><option value="ACTIVE" th:selected="${c.status() == 'ACTIVE'}">Hoạt động</option><option value="INACTIVE" th:selected="${c.status() == 'INACTIVE'}">Ngừng hoạt động</option></select></label><div class="form-message" role="alert"></div><button class="secondary">Lưu danh mục</button></form></article></section><aside class="panel"><h2>Thêm danh mục</h2><form data-api="/api/v1/admin/categories" data-success="reload"><label>Mã danh mục<input name="code" pattern="[A-Za-z0-9-]{3,50}" required></label><label>Tên<input name="name" minlength="2" maxlength="100" required></label><input type="hidden" name="status" value="ACTIVE"><div class="form-message" role="alert"></div><button>Tạo danh mục</button></form></aside></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
