<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="channels" class="panel"><h2>Doanh thu theo kênh &amp; chi nhánh</h2><div class="table-wrap"><table><thead><tr><th>Kênh nhận hàng</th><th>Chi nhánh</th><th>Đơn đã giao</th><th>Tiền hàng sau ưu đãi</th><th>Phí giao</th><th>Tiền hoàn</th><th>Thu ròng</th></tr></thead><tbody><tr th:each="c:${channels}"><td th:text="${c.fulfillmentType()}"></td><td th:text="${c.branch()}"></td><td th:text="${c.deliveredOrders()}"></td><td th:text="${#numbers.formatInteger(c.goodsRevenue(),1,'POINT')}+' ₫'"></td><td th:text="${#numbers.formatInteger(c.shippingRevenue(),1,'POINT')}+' ₫'"></td><td th:text="${#numbers.formatInteger(c.refundedAmount(),1,'POINT')}+' ₫'"></td><td th:text="${#numbers.formatInteger(c.netRevenue(),1,'POINT')}+' ₫'"></td></tr></tbody></table></div></section></body></html>
