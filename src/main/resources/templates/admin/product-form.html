<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Chỉnh sửa sản phẩm')}"></head><body><header th:replace="~{fragments :: header}"></header><main><nav th:replace="~{fragments :: adminNav}"></nav><h1 th:text="${product == null ? 'Thêm sản phẩm' : product.name()}"></h1><div class="two-column"><section class="panel"><form th:attr="data-api=${product == null ? '/api/v1/admin/products' : '/api/v1/admin/products/' + product.id()},data-method=${product == null ? 'POST' : 'PATCH'}" data-success="/admin/products"><label th:if="${product == null}">SKU<input name="sku" pattern="[A-Za-z0-9-]{3,50}" required></label><p th:if="${product != null}" class="muted" th:text="'SKU bất biến: ' + ${product.sku()}"></p><input th:if="${product != null}" type="hidden" name="expectedVersion" data-number th:value="${product.version()}"><label>Tên sản phẩm<input name="name" minlength="2" maxlength="200" th:value="${product != null ? product.name() : ''}" required></label><label>Danh mục<select name="categoryId" data-number required><option th:each="c : ${categories}" th:value="${c.id()}" th:text="${c.name()}" th:selected="${product != null && c.id() == product.categoryId()}"></option></select></label><label>Giá VND<input type="number" name="price" data-number min="0" max="999999999" step="1" th:value="${product != null ? product.price() : 0}" required></label><label>Mô tả<textarea name="description" maxlength="5000" th:text="${product != null ? product.description() : ''}"></textarea></label><label>Trạng thái<select name="status"><option value="ACTIVE" th:selected="${product == null || product.status() == 'ACTIVE'}">Đang bán</option><option value="INACTIVE" th:selected="${product != null && product.status() == 'INACTIVE'}">Ngừng bán</option></select></label><div class="form-message" role="alert"></div><button>Lưu sản phẩm</button></form></section><aside class="panel" th:if="${product != null}"><h2>Điều chỉnh tồn kho</h2><p th:text="'Đang có: ' + ${product.stockQuantity()}"></p><form th:attr="data-api=${'/api/v1/admin/products/' + product.id() + '/stock-adjustments'}" data-success="reload"><input type="hidden" name="expectedVersion" data-number th:value="${product.version()}"><label>Số lượng tăng / giảm<input type="number" name="delta" data-number placeholder="Ví dụ 10 hoặc -2" required></label><label>Lý do<textarea name="reason" minlength="5" maxlength="500" required></textarea></label><div class="form-message" role="alert"></div><button class="secondary">Ghi nhận điều chỉnh</button></form><h3>Lịch sử gần đây</h3><ul class="timeline"><li th:each="m : ${ledger.content()}"><strong th:text="${m.type()} + ': ' + ${m.delta()} + ' → ' + ${m.balanceAfter()}"></strong><p th:text="${m.reason()}"></p><small th:text="${m.occurredAt()}"></small></li></ul></aside></div><p class="note">Sản phẩm mới bắt đầu với tồn kho 0; dùng điều chỉnh kho để nhập số lượng. Ảnh minh họa chung trong bản code đầu tiên.</p></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
