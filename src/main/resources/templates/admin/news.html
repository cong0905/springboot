<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Quản trị bài viết')}"></head><body><header th:replace="~{fragments :: header}"></header><main><nav th:replace="~{fragments :: adminNav}"></nav><h1>Quản trị bài viết</h1><p>Nội dung văn bản được hiển thị an toàn, không thực thi HTML. Ghi nguồn nếu sử dụng tài liệu bên ngoài.</p><section class="panel"><form th:attr="data-api=${article==null?'/api/v1/admin/news':'/api/v1/admin/news/'+article.id()},data-method=${article==null?'POST':'PATCH'}" data-success="/admin/news/{id}"><input th:if="${article!=null}" type="hidden" name="expectedVersion" data-number th:value="${article.version()}"><label>Slug<input name="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="160" required th:value="${article?.slug()}"></label><label>Tiêu đề<input name="title" minlength="5" maxlength="200" required th:value="${article?.title()}"></label><label>Tóm tắt<textarea name="excerpt" maxlength="500" required th:text="${article?.excerpt()}"></textarea></label><label>Nội dung<textarea name="body" minlength="20" maxlength="20000" rows="12" required th:text="${article?.body()}"></textarea></label><label>Nguồn tham khảo<input name="sourceUrl" type="url" maxlength="500" th:value="${article?.sourceUrl()}"></label><label>Trạng thái<select name="status"><option th:each="s:${ {'DRAFT','PUBLISHED','ARCHIVED'} }" th:value="${s}" th:text="${s}" th:selected="${article!=null && article.status()==s}"></option></select></label><div class="form-message" role="alert"></div><button>Lưu bài viết</button><a href="/admin/news">Tạo bài mới</a></form></section><article class="panel" th:each="a:${articles.content()}"><a th:href="@{/admin/news/{id}(id=${a.id()})}" th:text="${a.title()}+' · '+${a.status()}"></a></article><div class="pagination"><a th:if="${articles.page()>0}" th:href="@{/admin/news(page=${articles.page()-1})}">Trang trước</a><a th:if="${articles.page()+1<articles.totalPages()}" th:href="@{/admin/news(page=${articles.page()+1})}">Trang sau</a></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
