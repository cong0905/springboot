<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="images" class="panel" th:if="${product!=null}"><h2>Album theo phiên bản</h2><p class="note">Tải ảnh qua biểu mẫu quản lý ảnh hiện có, rồi gán ảnh cho phiên bản. Bỏ trống mã biến thể để dùng ảnh chung.</p><form th:each="img:${variantImages}" th:attr="data-api=@{/api/v1/admin/products/{id}/images/{imageId}/variant(id=${product.id()},imageId=${img.id()})}" data-method="PATCH" data-success="reload"><img th:src="${img.assetPath()}" alt="Ảnh quản lý" width="80" height="80"><label>Mã biến thể<input name="variantId" type="number" min="1" data-number th:value="${img.variantId()}"></label><div class="form-message" role="alert"></div><button>Lưu liên kết ảnh</button></form></section></body></html>
