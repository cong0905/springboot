<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="tools" class="commerce-grid"><form class="panel" data-api="/api/v1/admin/warranty/{warrantyId}/exchange" data-success="reload"><h2>Đổi máy 30 ngày</h2><p class="note">Máy thay thế phải cùng phiên bản và cùng chi nhánh. Máy lỗi được chuyển sang DEFECTIVE; thời hạn bảo hành gốc được giữ nguyên.</p><label>Mã thẻ bảo hành<input name="warrantyId" type="number" data-number min="1" required></label><label>Serial máy thay thế<input name="replacementSerial" minlength="5" maxlength="40" required></label><div class="form-message" role="alert"></div><button>Đã kiểm tra · Đổi máy</button></form><div class="panel"><h2>Quét IMEI bằng camera</h2><p class="note">Trình duyệt cần hỗ trợ BarcodeDetector và được cấp quyền camera. Máy quét USB có thể nhập trực tiếp vào ô serial.</p><button type="button" data-scan-camera>Mở camera</button><button type="button" data-stop-camera hidden>Dừng camera</button><video data-scan-video autoplay muted playsinline style="width:100%;max-height:240px" hidden></video><p data-scan-message role="status"></p></div></section></body></html>
