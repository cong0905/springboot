<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="settings">
<h2>Bảng giá thu cũ &amp; gói trả góp</h2><p class="note">Thêm điều khoản mới hoặc ngừng cung cấp. Phiếu và hồ sơ đã tạo giữ nguyên giá trị; không sửa hồi tố.</p>
<div class="commerce-grid">
<form class="panel" data-api="/api/v1/admin/trade-in/devices" data-success="reload"><h3>Thêm model thu cũ</h3><label>Tên model<input name="model" maxlength="100" required></label><label>Giá thu cơ sở (₫)<input name="basePrice" type="number" min="0" max="999999999" step="1" data-number required></label><label>Trợ giá (₫)<input name="subsidyAmount" type="number" min="0" max="999999999" step="1" value="0" data-number required></label><div class="form-message" role="alert"></div><button>Thêm model</button></form>
<form class="panel" data-api="/api/v1/admin/trade-in/criteria" data-success="reload"><h3>Thêm mức tình trạng máy</h3><label>Tình trạng<input name="name" maxlength="100" required></label><label>Khấu trừ (%)<input name="deductionPercent" type="number" min="0" max="100" step="1" data-number required></label><div class="form-message" role="alert"></div><button>Thêm mức khấu trừ</button></form>
<form class="panel" data-api="/api/v1/admin/installment/plans" data-success="reload"><h3>Thêm gói trả góp nội bộ</h3><label>Đơn vị / tên gói<input name="provider" maxlength="100" required></label><label>Kỳ hạn<select name="months" data-number><option>3</option><option>6</option><option>9</option><option>12</option></select></label><label>Phí chuyển đổi (%)<input name="feePercent" type="number" min="0" max="100" step="0.01" value="0" data-number required></label><div class="form-message" role="alert"></div><button>Thêm gói demo</button></form>
</div><div class="commerce-grid"><article class="panel" th:each="d:${tradeDevices}"><h3 th:text="${d.model()}"></h3><p th:text="'Giá cơ sở: '+${#numbers.formatInteger(d.basePrice(),1,'POINT')}+' ₫ · Trợ giá: '+${#numbers.formatInteger(d.subsidyAmount(),1,'POINT')}+' ₫'"></p><p th:text="${d.active()?'Đang nhận thu':'Đã ngừng nhận'}"></p><form th:if="${d.active()}" th:attr="data-api=@{/api/v1/admin/trade-in/devices/{id}/archive(id=${d.id()})}" data-success="reload"><div class="form-message" role="alert"></div><button class="secondary">Ngừng nhận model</button></form></article>
<article class="panel" th:each="p:${installmentPlans}"><h3 th:text="${p.provider()}+' · '+${p.months()}+' tháng'"></h3><p th:text="'Phí: '+${p.feePercent()}+'%'"></p><p th:text="${p.active()?'Đang cung cấp':'Đã ngừng cung cấp'}"></p><form th:if="${p.active()}" th:attr="data-api=@{/api/v1/admin/installment/plans/{id}/archive(id=${p.id()})}" data-success="reload"><div class="form-message" role="alert"></div><button class="secondary">Ngừng cung cấp</button></form></article></div>
<p th:each="c:${tradeCriteria}" th:text="${c.name()}+' · Khấu trừ '+${c.deductionPercent()}+'%'"></p>
</section></body></html>
