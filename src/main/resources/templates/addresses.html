<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Sổ địa chỉ')}"></head><body><header th:replace="~{fragments :: header}"></header><main>
<nav class="filters"><a href="/profile">Hồ sơ</a><a href="/addresses">Sổ địa chỉ</a><a href="/orders">Đơn hàng</a></nav><h1>Sổ địa chỉ</h1><p>Địa chỉ đã đặt hàng được giữ nguyên trong đơn khi bạn sửa hoặc xóa tại đây.</p>
<div class="two-column"><section class="panel"><h2>Thêm địa chỉ</h2><form data-api="/api/v1/me/addresses" data-success="reload">
<label>Người nhận<input name="recipientName" minlength="2" maxlength="100" autocomplete="name" required></label><label>Điện thoại<input name="phone" pattern="0[0-9]{9}" maxlength="10" autocomplete="tel" required></label><label>Địa chỉ<textarea name="address" minlength="10" maxlength="500" autocomplete="street-address" required></textarea></label><label><input type="checkbox" name="defaultAddress">Đặt làm mặc định</label><div class="form-message" role="alert"></div><button>Thêm địa chỉ</button></form></section>
<section><p th:if="${addresses.isEmpty()}">Chưa có địa chỉ.</p><article class="panel" th:each="a:${addresses}"><h2 th:text="${a.defaultAddress()?'Địa chỉ mặc định':'Địa chỉ'}"></h2><form th:attr="data-api='/api/v1/me/addresses/'+${a.id()}" data-method="PATCH" data-success="reload"><input type="hidden" name="expectedVersion" data-number th:value="${a.version()}"><label>Người nhận<input name="recipientName" th:value="${a.recipientName()}" required minlength="2" maxlength="100"></label><label>Điện thoại<input name="phone" th:value="${a.phone()}" pattern="0[0-9]{9}" maxlength="10" required></label><label>Địa chỉ<textarea name="address" th:text="${a.address()}" minlength="10" maxlength="500" required></textarea></label><label><input type="checkbox" name="defaultAddress" th:checked="${a.defaultAddress()}">Mặc định</label><div class="form-message" role="alert"></div><button>Lưu địa chỉ</button></form><form th:attr="data-api='/api/v1/me/addresses/'+${a.id()}+'?expectedVersion='+${a.version()}" data-method="DELETE" data-success="reload"><div class="form-message" role="alert"></div><button class="danger">Xóa địa chỉ</button></form></article></section></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
