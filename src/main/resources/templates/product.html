<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Chi tiết sản phẩm')}"></head><body><header th:replace="~{fragments :: header}"></header><main><a href="/products" class="back">← Tất cả sản phẩm</a><div class="two-column product-detail"><div class="detail-picture"><img th:src="${product.thumbnailPath()}" th:alt="${product.name()}"></div><section class="panel"><span class="eyebrow" th:text="${product.categoryName()}"></span><h1 th:text="${product.name()}"></h1><p class="muted" th:text="'SKU: ' + ${product.sku()}"></p><strong class="large-price" th:text="${#numbers.formatInteger(product.price(),1,'POINT')} + ' ₫'"></strong><p th:text="${product.description()}"></p><p th:text="'Còn ' + ${product.stockQuantity()} + ' sản phẩm'"></p>
<form th:if="${isCustomer}" data-api="/api/v1/cart/items" data-success="/cart"><input type="hidden" name="productId" data-number th:value="${product.id()}"><input type="hidden" name="expectedVersion" data-number th:value="${cartVersion}"><label>Số lượng<input type="number" name="quantity" data-number min="1" max="99" value="1" required></label><div class="form-message" role="alert"></div><button th:disabled="${product.stockQuantity() == 0}">Thêm vào giỏ hàng</button></form><a th:if="${viewer == null}" href="/login" class="button">Đăng nhập để mua hàng</a><p class="note">Thanh toán khi nhận hàng. Miễn phí giao từ 1.000.000 ₫.</p></section></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
