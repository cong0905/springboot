<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Thu cũ đổi mới')}"></head><body><header th:replace="~{fragments :: header}"></header><main><h1>Thu cũ đổi mới</h1><p class="note">Giá online là dự kiến. Mang máy đến cửa hàng để thẩm định; phiếu được duyệt có thể áp dụng tại checkout trong 7 ngày.</p><form class="panel" data-api="/api/v1/me/trade-in" data-success="reload"><label>Máy cũ<select name="deviceId" data-number><option th:each="d:${devices}" th:value="${d.id()}" th:text="${d.model()}"></option></select></label><label>Tình trạng<select name="criteriaId" data-number><option th:each="c:${criteria}" th:value="${c.id()}" th:text="${c.name()}"></option></select></label><label>IMEI / Serial máy cũ<input name="oldImei" pattern="[A-Za-z0-9-]{5,40}" required></label><div class="form-message" role="alert"></div><button>Nhận giá dự kiến</button></form><h2>Phiếu của tôi</h2><div class="commerce-grid"><article class="panel" th:each="q:${quotes}"><h3 th:text="'Phiếu #'+${q.id()}+' · '+${q.model()}"></h3><p th:text="${q.condition()}+' · '+${q.oldImei()}"></p><strong th:text="${#numbers.formatInteger(q.quotedAmount(),1,'POINT')}+' ₫'"></strong><p th:text="${q.status()}"></p></article></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
