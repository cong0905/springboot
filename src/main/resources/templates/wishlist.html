<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Sản phẩm yêu thích')}"></head><body><header th:replace="~{fragments :: header}"></header><main><h1>Sản phẩm yêu thích</h1><p th:if="${wishlist.isEmpty()}">Chưa có sản phẩm yêu thích. Thêm từ trang chi tiết sản phẩm.</p><article class="panel" th:each="p:${wishlist}"><a th:if="${p.available()}" th:href="@{/products/{id}(id=${p.id()})}" th:text="${p.name()}"></a><p th:unless="${p.available()}" th:text="${p.name()}+' · Tạm ngừng bán'"></p><form th:attr="data-api='/api/v1/me/wishlist/'+${p.id()}" data-method="DELETE" data-success="reload"><div class="form-message" role="alert"></div><button>Xóa khỏi yêu thích</button></form></article></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
