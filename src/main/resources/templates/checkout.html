<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đặt hàng')}"></head><body><header th:replace="~{fragments :: header}"></header><main><a href="/cart" class="back">← Giỏ hàng</a><h1>Hoàn tất đơn hàng</h1><p class="alert" th:unless="${cart.canCheckout()}">Giỏ hàng chưa đủ điều kiện đặt. Vui lòng quay lại kiểm tra.</p><div class="two-column" th:if="${cart.canCheckout()}"><section class="panel"><h2>Thông tin giao hàng</h2><form id="checkout-form" data-api="/api/v1/orders" data-success="/orders/{id}" data-checkout><input type="hidden" name="checkoutKey" th:value="${checkoutKey}"><input type="hidden" name="cartVersion" data-number th:value="${cart.version()}"><input type="hidden" name="expectedTotal" data-number th:value="${cart.total()}"><input type="hidden" name="expectedPricingHash" th:value="${cart.pricingHash()}"><label>Người nhận<input name="recipientName" th:value="${viewer.fullName()}" autocomplete="name" minlength="2" maxlength="100" required></label><label>Số điện thoại<input type="tel" name="phone" autocomplete="tel" pattern="0[0-9]{9}" placeholder="10 chữ số, bắt đầu bằng 0" required></label><label>Địa chỉ đầy đủ<textarea name="address" autocomplete="street-address" minlength="10" maxlength="500" required></textarea></label><label>Ghi chú<textarea name="note" maxlength="500"></textarea></label><div class="payment">● Thanh toán khi nhận hàng — COD</div><div class="form-message" role="alert"></div><button class="full">Xác nhận đặt hàng</button><button type="button" class="secondary full" data-refresh-preview hidden>Cập nhật giá và xác nhận lại</button></form></section><aside class="panel summary"><h2>Đơn của bạn</h2><div data-preview-lines><p th:each="i : ${cart.items()}"><span th:text="${i.name()} + ' × ' + ${i.quantity()}"></span><strong th:text="${#numbers.formatInteger(i.lineTotal(),1,'POINT')} + ' ₫'"></strong></p></div><p><span>Phí giao</span><strong data-preview-fee th:text="${#numbers.formatInteger(cart.shippingFee(),1,'POINT')} + ' ₫'"></strong></p><p class="total"><span>Tổng thanh toán</span><strong data-preview-total th:text="${#numbers.formatInteger(cart.total(),1,'POINT')} + ' ₫'"></strong></p><p class="note">Kiểm tra địa chỉ và tổng tiền trước khi xác nhận.</p></aside></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
