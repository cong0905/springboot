<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Tin công nghệ')}"></head><body><header th:replace="~{fragments :: header}"></header><main><h1>Tin công nghệ</h1><p th:if="${articles.content().isEmpty()}">Chưa có bài viết được xuất bản.</p><article class="panel" th:each="a:${articles.content()}"><h2><a th:href="@{/news/{slug}(slug=${a.slug()})}" th:text="${a.title()}"></a></h2><p th:text="${a.excerpt()}"></p></article><div class="pagination"><a th:if="${articles.page()>0}" th:href="@{/news(page=${articles.page()-1})}">Trang trước</a><a th:if="${articles.page()+1<articles.totalPages()}" th:href="@{/news(page=${articles.page()+1})}">Trang sau</a></div><a href="/newsletter">Đăng ký nhận tin</a></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
