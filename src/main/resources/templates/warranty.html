<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Tra cứu bảo hành')}"></head><body><header th:replace="~{fragments :: header}"></header><main><h1>Tra cứu bảo hành điện tử</h1><form method="get" class="panel"><label>IMEI / Serial<input name="query" th:value="${query}" minlength="5" maxlength="40" required></label><label>Số điện thoại mua hàng (tùy chọn)<input name="phone" pattern="0[0-9]{9}"></label><button>Tra cứu</button></form><p class="note">Tra cứu công khai chỉ hiển thị thời hạn bảo hành. Đăng nhập hội viên để xem toàn bộ máy của bạn.</p><div class="commerce-grid"><article class="panel" th:each="c:${cards}"><h2 th:text="${c.imeiNumber()}"></h2><p th:text="${c.warrantyType()}"></p><p th:text="${c.startDate()}+' → '+${c.endDate()}"></p></article></div><p th:if="${query!=null && cards.isEmpty()}">Chưa tìm thấy bảo hành khớp thông tin.</p></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
