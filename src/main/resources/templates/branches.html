<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Hệ thống cửa hàng')}"></head><body><header th:replace="~{fragments :: header}"></header><main><span class="eyebrow">TechShop gần bạn</span><h1>Hệ thống cửa hàng</h1><div data-region-filters class="region-filters"><label>Tỉnh / thành (mã khu vực)<select name="provinceCode"><option value="">Tất cả tỉnh / thành</option></select></label><label>Khu vực cửa hàng<select name="districtCode"><option value="">Tất cả khu vực</option></select></label><p data-region-message class="note" role="status"></p></div><div class="commerce-grid"><article class="panel" data-branch-card th:attr="data-province=${b.provinceCode()},data-district=${b.districtCode()}" th:each="b:${branches}"><h2 th:text="${b.name()}"></h2><p th:text="${b.address()}"></p><p th:text="${b.phone()}"></p><p th:text="${b.openingHours()!=null?b.openingHours():'Chưa cập nhật giờ mở cửa. Vui lòng gọi cửa hàng.'}"></p><img th:if="${b.photoPath()!=null}" th:src="${b.photoPath()}" th:alt="${b.name()}" loading="lazy" style="width:100%;max-height:240px;object-fit:cover"><a class="button secondary" target="_blank" rel="noopener" th:href="'https://www.openstreetmap.org/?mlat='+${b.latitude()}+'&amp;mlon='+${b.longitude()}+'#map=16/'+${b.latitude()}+'/'+${b.longitude()}">Xem bản đồ</a></article></div><p data-branches-empty hidden class="note" role="status">Không có cửa hàng trong khu vực đã chọn.</p><p class="note">Chọn phiên bản trên trang sản phẩm để xem tồn kho từng cửa hàng. Đơn nhận tại cửa hàng được giữ máy trong 24 giờ.</p></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
