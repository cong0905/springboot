<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đơn hàng')}"></head><body><header th:replace="~{fragments :: header}"></header><main><nav th:if="${isAdmin}" th:replace="~{fragments :: adminNav}"></nav><h1 th:text="${isAdmin ? 'Quản lý đơn hàng' : 'Đơn hàng của tôi'}"></h1><form method="get" class="filters"><label>Trạng thái<select name="status"><option value="">Tất cả</option><option th:each="s : ${ {'PENDING','CONFIRMED','SHIPPED','DELIVERED','CANCELLED'} }" th:selected="${s == status}" th:value="${s}" th:text="${s}"></option></select></label><button>Lọc</button></form><div class="panel table-wrap"><table><thead><tr><th>Mã đơn</th><th>Ngày đặt UTC</th><th>Trạng thái</th><th>Tổng tiền</th><th></th></tr></thead><tbody><tr th:each="o : ${orders.content()}"><td th:text="${o.orderCode()}"></td><td th:text="${o.createdAt()}"></td><td><span class="badge" th:text="${o.status()}"></span></td><td th:text="${#numbers.formatInteger(o.total(),1,'POINT')} + ' ₫'"></td><td><a th:href="${isAdmin ? '/admin/orders/' + o.id() : '/orders/' + o.id()}">Chi tiết →</a></td></tr><tr th:if="${orders.content().isEmpty()}"><td colspan="5">Chưa có đơn hàng.</td></tr></tbody></table></div><div class="pagination"><a th:if="${orders.page() > 0}" th:href="@{''(page=${orders.page()-1},status=${status})}">← Trang trước</a><span th:text="'Trang ' + ${orders.page()+1}"></span><a th:if="${orders.page()+1 < orders.totalPages()}" th:href="@{''(page=${orders.page()+1},status=${status})}">Trang sau →</a></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
