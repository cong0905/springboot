<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đăng ký nhận tin')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="auth-wrap"><section class="panel"><h1>Đăng ký nhận tin</h1><p>Email chỉ được đăng ký sau khi bạn xác nhận. Có thể hủy qua liên kết trong thư.</p><p th:unless="${mailEnabled}">Email chưa được cấu hình.</p><form th:if="${mailEnabled}" data-newsletter-request><label>Email<input name="email" type="email" maxlength="254" autocomplete="email" required></label><label><input type="checkbox" name="consent" required>Tôi đồng ý nhận email tin tức TechZone.</label><div class="form-message" role="status"></div><button>Gửi thư xác nhận</button></form><p th:if="${param.done}">Yêu cầu đã xử lý.</p></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
