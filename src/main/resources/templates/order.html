<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Chi tiết đơn')}"></head><body><header th:replace="~{fragments :: header}"></header><main><a th:href="${isAdmin ? '/admin/orders' : '/orders'}" class="back">← Danh sách đơn</a><div class="section-heading"><h1 th:text="${order.orderCode()}"></h1><span class="badge" th:text="${order.status()}"></span></div><div class="two-column"><section class="panel"><h2>Sản phẩm đã đặt</h2><div class="cart-line" th:each="i : ${order.items()}"><div><h3 th:text="${i.name()}"></h3><p class="muted" th:text="${i.sku()} + ' · Số lượng ' + ${i.quantity()}"></p></div><strong th:text="${#numbers.formatInteger(i.lineTotal(),1,'POINT')} + ' ₫'"></strong></div><div class="summary"><p><span>Phí giao</span><strong th:text="${#numbers.formatInteger(order.shippingFee(),1,'POINT')} + ' ₫'"></strong></p><p class="total"><span>Tổng thanh toán</span><strong th:text="${#numbers.formatInteger(order.total(),1,'POINT')} + ' ₫'"></strong></p></div><h2>Lịch sử xử lý</h2><ol class="timeline"><li th:each="h : ${order.history()}"><strong th:text="${h.toStatus()}"></strong><small th:text="${h.occurredAt()} + ' UTC'"></small><p th:text="${h.reason()}"></p></li></ol></section><aside class="panel"><h2>Thông tin giao hàng</h2><p th:text="${order.recipientName()}"></p><p th:text="${order.phone()}"></p><p th:text="${order.address()}"></p><p th:if="${order.note() != null}" th:text="${order.note()}"></p><p class="note">Thanh toán COD</p>
<form th:if="${order.status() == 'PENDING' || (isAdmin && order.status() == 'CONFIRMED')}" th:attr="data-api=${isAdmin ? '/api/v1/admin/orders/' + order.id() + '/cancel' : '/api/v1/orders/' + order.id() + '/cancel'}" data-success="reload"><h3>Hủy đơn</h3><input type="hidden" name="expectedVersion" data-number th:value="${order.version()}"><label>Lý do<textarea name="reason" minlength="5" maxlength="500" required></textarea></label><div class="form-message" role="alert"></div><button class="danger">Hủy và hoàn tồn kho</button></form>
<form th:if="${isAdmin && (order.status() == 'PENDING' || order.status() == 'CONFIRMED' || order.status() == 'SHIPPED')}" th:attr="data-api=${'/api/v1/admin/orders/' + order.id() + '/transitions'}" data-success="reload"><h3>Xử lý đơn</h3><input type="hidden" name="expectedVersion" data-number th:value="${order.version()}"><input type="hidden" name="targetStatus" th:value="${order.status() == 'PENDING' ? 'CONFIRMED' : (order.status() == 'CONFIRMED' ? 'SHIPPED' : 'DELIVERED')}"><label th:if="${order.status() == 'SHIPPED'}" class="check"><input type="checkbox" name="codCollected" required> Xác nhận đã giao và thu COD</label><div class="form-message" role="alert"></div><button th:text="${order.status() == 'PENDING' ? 'Xác nhận đơn' : (order.status() == 'CONFIRMED' ? 'Bàn giao vận chuyển' : 'Hoàn tất giao hàng')}"></button></form>
</aside></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
