<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đăng ký')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="auth-wrap"><section class="panel auth-panel"><span class="eyebrow">BẮT ĐẦU CÙNG TECHSHOP</span><h1>Tạo tài khoản</h1><form data-api="/api/v1/auth/register" data-success="/login?registered"><label>Họ tên<input name="fullName" autocomplete="name" minlength="2" maxlength="100" required></label><label>Email<input type="email" name="email" autocomplete="email" maxlength="254" required></label><label>Mật khẩu<input type="password" name="password" autocomplete="new-password" minlength="10" maxlength="64" required><small>10–64 ký tự, tối đa 72 byte UTF-8.</small></label><div class="form-message" role="alert"></div><button class="full">Đăng ký</button></form><p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
