<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng ký tài khoản')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="auth-wrap" style="max-width: 480px; margin: 2rem auto; padding: 0 1rem;">
    <section class="panel auth-panel">
        <span class="eyebrow" style="color: var(--primary); font-weight: 700;">GIA NHẬP TECHSHOP</span>
        <h1 style="margin: 8px 0;">Đăng ký Smember</h1>
        <p class="muted" style="color: var(--text-muted); margin-bottom: 1.5rem;">Nhận ngay đặc quyền tích điểm S-Point, chiết khấu hạng thành viên và bảo hành điện tử chính hãng.</p>
        
        <form data-api="/api/v1/auth/register" data-success="/login?registered">
            <label style="display: block; margin-bottom: 1rem;">Họ và tên
                <input name="fullName" autocomplete="name" minlength="2" maxlength="100" required placeholder="Nguyễn Văn A" style="width: 100%; margin-top: 4px;">
            </label>
            <label style="display: block; margin-bottom: 1rem;">Email liên hệ
                <input type="email" name="email" autocomplete="email" maxlength="254" required placeholder="name@domain.com" style="width: 100%; margin-top: 4px;">
            </label>
            <label style="display: block; margin-bottom: 1.5rem;">Mật khẩu
                <input type="password" name="password" autocomplete="new-password" minlength="10" maxlength="64" required placeholder="Ít nhất 10 ký tự..." style="width: 100%; margin-top: 4px;">
                <small style="color: var(--text-muted); display: block; margin-top: 4px;">Yêu cầu: 10–64 ký tự an toàn.</small>
            </label>
            
            <div class="form-message" role="alert" style="margin-bottom: 1rem;"></div>
            
            <button type="submit" class="button full" style="padding: 12px; font-size: 1rem; font-weight: 600;">Tạo tài khoản ngay</button>
        </form>

        <p style="margin-top: 1.5rem; text-align: center; color: var(--text-muted);">
            Đã có tài khoản? <a href="/login" style="color: var(--primary); font-weight: 600;">Đăng nhập</a>
        </p>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
