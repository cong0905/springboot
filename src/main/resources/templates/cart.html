<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Giỏ hàng')}"></head><body><header th:replace="~{fragments :: header}"></header><main><span class="eyebrow">ĐÃ CHỌN CHO BẠN</span><h1>Giỏ hàng</h1><div class="empty" th:if="${cart.items().isEmpty()}"><h2>Giỏ hàng đang trống</h2><a href="/products" class="button">Khám phá sản phẩm</a></div><div class="two-column" th:unless="${cart.items().isEmpty()}"><section class="panel"><article class="cart-line" th:each="i : ${cart.items()}"><div><h3 th:text="${i.name()}"></h3><p th:text="${#numbers.formatInteger(i.unitPrice(),1,'POINT')} + ' ₫ / sản phẩm'"></p><p class="alert" th:unless="${i.available()}">Sản phẩm hết hàng, ngừng bán hoặc không đủ số lượng.</p></div><div class="line-actions"><form th:attr="data-api=@{/api/v1/cart/items/{id}(id=${i.itemId()})}" data-method="PATCH" data-success="reload"><input type="hidden" name="expectedVersion" data-number th:value="${cart.version()}"><label class="sr-only" th:for="'qty-' + ${i.itemId()}">Số lượng</label><input th:id="'qty-' + ${i.itemId()}" type="number" name="quantity" data-number min="1" max="99" th:value="${i.quantity()}" required><button class="secondary small">Cập nhật</button><div class="form-message" role="alert"></div></form><form th:attr="data-api=@{/api/v1/cart/items/{id}(id=${i.itemId()},expectedVersion=${cart.version()})}" data-method="DELETE" data-success="reload"><button class="link-button">Xóa</button><div class="form-message" role="alert"></div></form></div></article></section><aside class="panel summary"><h2>Tổng đơn dự kiến</h2><p><span>Tiền hàng</span><strong th:text="${#numbers.formatInteger(cart.subtotal(),1,'POINT')} + ' ₫'"></strong></p><p><span>Phí giao</span><strong th:text="${#numbers.formatInteger(cart.shippingFee(),1,'POINT')} + ' ₫'"></strong></p><p class="total"><span>Tổng cộng</span><strong th:text="${#numbers.formatInteger(cart.total(),1,'POINT')} + ' ₫'"></strong></p><a th:if="${cart.canCheckout()}" href="/checkout" class="button full">Tiến hành đặt hàng</a><p class="note">Giỏ hàng chưa giữ tồn kho. Giá và số lượng được kiểm tra lại khi đặt đơn.</p></aside></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
